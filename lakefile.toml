name = "BoringMath"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["BoringMath"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
autoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header.license = "Released under the Hippocratic Mathematics License v1.0, as described in the file LICENSE."
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[require]]
name = "CombinatorialGames"
git = "https://github.com/vihdzp/combinatorial-games.git"
rev = "d949bd1fd3355d23175b8ed0834e0bb166e5fd3b"

[[lean_lib]]
name = "BoringMath"
globs = ["BoringMath.+"]
